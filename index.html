<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Distributed Student Data System (Makassar Region)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- LOGIN -->
    <div id="loginPage" class="login-container">
      <div class="login-card">
        <h2>Login Sistem</h2>
        <input id="loginUser" type="text" placeholder="Username" />
        <input id="loginPass" type="password" placeholder="Password" />
        <button id="btnLogin" class="btn-primary">Masuk</button>
        <!-- <p class="login-info">Akun demo: <b>admin / admin123</b></p> -->
      </div>
    </div>

    <!-- MAIN -->
    <div id="mainPage" class="hidden">
      <header class="header">
        <h1>
          Distributed Student Data System<br /><span class="subtitle"
            >Makassar Region</span
          >
        </h1>
        <div class="header-actions">
          <button id="btnLogout" class="btn-secondary">Logout</button>
        </div>
      </header>

      <div class="layout">
        <!-- LEFT: form, simulasi, log -->
        <div class="left-column">
          <!-- Form -->
          <section class="card">
            <h2>Input Data Mahasiswa</h2>
            <label for="nim">NIM</label>
            <input id="nim" type="text" placeholder="e.g. 220209501004" />

            <label for="nama">Nama</label>
            <input id="nama" type="text" />

            <label for="kampus">Kampus (pengirim)</label>
            <select id="kampus">
              <option value="UNM">UNM (Leader)</option>
              <option value="UNHAS">UNHAS</option>
              <option value="UIN">UIN Alauddin</option>
              <option value="PNUP">PNUP</option>
              <option value="POLTEKPAR">Poltekpar</option>
            </select>

            <label for="prodi">Program Studi</label>
            <input id="prodi" type="text" />

            <button id="btnSend" class="btn-primary">Kirim Data</button>
          </section>

          <!-- Simulasi -->
          <section class="card">
            <h2>Simulasi Sistem</h2>
            <div class="sim-row">
              <div class="sim-item">
                <label for="delayUnhas">Delay UNHAS (detik)</label>
                <input
                  id="delayUnhas"
                  type="number"
                  min="0"
                  step="0.5"
                  value="0"
                />
                <button id="btnSetDelay" class="btn-secondary">
                  Set Delay
                </button>
              </div>

              <div class="sim-item">
                <label>UIN Alauddin</label>
                <button id="btnToggleUIN" class="btn-danger">
                  Disconnect UIN
                </button>
              </div>
            </div>

            <div class="sim-actions">
              <button id="btnConflict" class="btn-warning full">
                Simulasi Konflik (UNM vs UNHAS)
              </button>
              <button id="btnSync" class="btn-secondary full">
                Sync Semua (UNM → semua)
              </button>
            </div>
          </section>

          <!-- Log -->
          <section class="card">
            <h2>Log Aktivitas Sistem</h2>
            <div
              id="logArea"
              class="log-box"
              title="Double-click untuk bersihkan"
            ></div>
            <div style="display: flex; gap: 8px; margin-top: 10px">
              <button id="btnClearLog" class="btn-secondary">Clear Log</button>
              <button id="btnExportLog" class="btn-secondary">
                Export Log
              </button>
            </div>
          </section>
        </div>

        <!-- RIGHT: status replikasi -->
        <div class="right-column">
          <section class="card">
            <h2>Status Replikasi Kampus</h2>

            <div class="campus-block">
              <h3>UNM (Leader)</h3>
              <p>Status: <span id="statusUNM" class="online">ONLINE</span></p>
              <div id="tableUNM" class="replica-table"></div>
            </div>

            <div class="campus-block">
              <h3>UNHAS</h3>
              <p>Status: <span id="statusUNHAS" class="online">ONLINE</span></p>
              <p>Delay: <span id="labelDelayUNHAS">0s</span></p>
              <div id="tableUNHAS" class="replica-table"></div>
            </div>

            <div class="campus-block">
              <h3>UIN Alauddin</h3>
              <p>Status: <span id="statusUIN" class="online">ONLINE</span></p>
              <div id="tableUIN" class="replica-table"></div>
            </div>

            <div class="campus-block">
              <h3>PNUP</h3>
              <p>Status: <span id="statusPNUP" class="online">ONLINE</span></p>
              <div id="tablePNUP" class="replica-table"></div>
            </div>

            <div class="campus-block">
              <h3>Poltekpar</h3>
              <p>
                Status: <span id="statusPOLTEKPAR" class="online">ONLINE</span>
              </p>
              <div id="tablePOLTEKPAR" class="replica-table"></div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
